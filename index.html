<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="outline"></canvas>
  <canvas id="main"></canvas>
  <canvas id="preview"></canvas>
  <div class="popup" id="menu">
    <h2>your palette</h2>
    <div id="mpaldiv"></div>
  </div>
  <div class="maindiv">
    <div class="flex">
    <div class="colorpicker">
      <canvas id="color"></canvas>
      <canvas id="hue"></canvas>
      <input id="colori">
    </div>
    <div class="buttons">
      <button id="bCopy">copy</button>
      <button id="bSet">set</button>
      <button id="bEdit">edit</button>
      <button id="bLeft"><-</button>
      <button id="bRight">-></button>
      <button id="bAdd">add</button>
      <button id="bRemove">remove</button>
      <button id="bOutline">outline</button>
      <button id="bDownload">download</button>
      <button id="bMenu">palette</button>
    </div>
    </div>
    <div class="pallete">
      <div id="paldiv"></div>
    </div>
  </div>
  <script src="./namina.js" type="module"></script>
</body>
</html>
